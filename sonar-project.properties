# Project metadata
sonar.projectKey=python-calculator-api
sonar.projectName=Python Calculator API
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.exclusions=**/test_*.py,**/__pycache__/**,venv/**

# Tests location
sonar.tests=.
sonar.test.inclusions=test_*.py

# Python specific
sonar.language=py
sonar.python.version=3.11

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
